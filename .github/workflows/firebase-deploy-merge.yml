# Deploy Firebase Hosting + siteGate (Cloud Functions v2) on push to main.
# Hosting-only action-hosting-deploy is not used — we need functions deploy.
# Cloud Run live-ingest is deployed separately: ./scripts/deploy_live_ingest.sh
#
# Required GitHub secret: FIREBASE_SERVICE_ACCOUNT_NHS_PATIENT_RECORDS
# (service account JSON — see docs/FIREBASE_LIVE_INGEST.md § CI)
# SITE_PASSWORD stays in GCP Secret Manager (not GitHub).

name: Deploy Firebase Hosting + Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Prepare Firebase public bundle
        run: npm run prepare:firebase

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NHS_PATIENT_RECORDS }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting + siteGate
        run: firebase deploy --only hosting,functions --project nhs-patient-records --non-interactive
